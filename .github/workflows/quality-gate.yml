# Maculis Quality Gate — hard delivery gate.
#
# Runs the overarching regression gate (scripts/quality-gate.mjs) on every push and PR against a real
# Postgres service, at FULL coverage (--require-db). A red critical chain fails the job, so new
# communication code cannot be treated as done while the gate is red. See docs/QUALITY_GATE.md.
name: quality-gate

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maculis_test
        ports:
          - 5432:5432
        # Wait until Postgres is ready before the job starts.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/maculis_test
      COMM_LAYER_ENABLED: '1'
      # Any base64 whsec_ secret: the inbound e-mail E2E signs its test webhooks with it. NOT a real
      # secret — a fixed test value so the gate is reproducible. No production secret is ever used here.
      RESEND_WEBHOOK_SECRET: whsec_YWktdGVzdC1zZWNyZXQ=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run the Maculis Quality Gate (full coverage)
        run: node scripts/quality-gate.mjs --require-db
