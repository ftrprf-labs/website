# FTRLABS Invitation Manager (Testerbeheer) — Render Blueprint (Docker web service).
#
# One-click-ish deploy: Render reads this file + the Dockerfile. Public HTTPS is
# automatic. PORT is injected by Render and read by the server. This app holds
# PII, so it is NEVER publicly open: ADMIN_PASSWORD + AUTH_SECRET are required in
# production (the server refuses to start without them) and are entered by hand
# in the Render dashboard (sync:false) — never committed here.
services:
  - type: web
    name: ftrlabs-testerbeheer
    runtime: docker
    region: frankfurt          # EU (closest to NL); AVG/GDPR data residency
    plan: starter              # always-on (survives after your Mac closes)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz  # server returns { ok: true } here
    autoDeploy: true           # redeploys on every push to the connected branch
    # Persistent disk for the JSON store (data survives restarts/redeploys).
    disk:
      name: testerbeheer-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data       # = the persistent disk mount above
      # --- Secrets: set these BY HAND in Render (Environment tab). sync:false
      #     keeps them out of git and out of this file. ---
      # The ONLY value you must choose at deploy: the admin login password.
      - key: ADMIN_PASSWORD    # required in production — you type this once at Apply
        sync: false
      - key: AUTH_SECRET       # keeps logins valid across deploys — Render generates it for you
        generateValue: true
      # Public + internal URL of the EXISTING Maculis Journey service (not secret).
      # Pre-filled so you don't have to type it. Change here if the Journey URL changes.
      - key: MACULIS_PUBLIC_URL
        value: https://maculis-first-five.onrender.com
      - key: MACULIS_HOST
        value: https://maculis-first-five.onrender.com
      # OPTIONAL — only needed for the live "Evaluaties" view (pull) and "Publiceer
      # naar Maculis" (push). Leave blank to deploy now; add later by copying the
      # matching values from the Journey service's Environment tab. sync:false so
      # they are never committed.
      - key: MACULIS_EXPORT_KEY # = the Journey's MACULIS_EXPORT_KEY (for the pull)
        sync: false
      - key: MACULIS_SYNC_KEY  # = the Journey's MACULIS_SYNC_KEY (for publish; optional)
        sync: false
      # --- E-mail via Resend (OPTIONAL; you can invite by WhatsApp without this) ---
      - key: MAIL_TRANSPORT
        value: resend
      - key: MAIL_API_KEY      # Resend API key (leave blank until you have one)
        sync: false
      - key: MAIL_FROM         # verified Resend sender (leave blank until you have one)
        sync: false
