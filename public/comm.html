<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maculis — Communicatie</title>
<style>
  :root{--bg:#0e0f12;--panel:#16181d;--panel2:#1c1f26;--line:#282c35;--ink:#ece2d4;--dim:#9aa0ac;--faint:#666d7a;--amber:#c8894a;--gold:#d7b36a;--in:#2b3a4a;--out:#2f2a1c;--priv:#3a2430}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:15px;margin:0;letter-spacing:.14em;font-weight:600}
  header .sp{flex:1}
  header a{color:var(--dim);text-decoration:none;font-size:13px}
  .tabs{display:flex;gap:4px}
  .tab{padding:5px 12px;border-radius:999px;background:transparent;border:1px solid var(--line);color:var(--dim);cursor:pointer;font-size:13px}
  .tab.on{background:var(--panel2);color:var(--ink);border-color:var(--amber)}
  .tab.priv.on{border-color:#b06;color:#f2b}
  main{flex:1;display:grid;grid-template-columns:320px 1fr 300px;min-height:0}
  .col{overflow-y:auto;min-height:0}
  .list{border-right:1px solid var(--line)}
  .conv{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
  .conv:hover{background:var(--panel)}
  .conv.on{background:var(--panel2)}
  .conv .who{font-size:14px;font-weight:600}
  .conv .org{font-size:12px;color:var(--dim)}
  .conv .snip{font-size:12px;color:var(--faint);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv .badge{float:right;font-size:10px;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
  .thread{display:flex;flex-direction:column;background:var(--bg)}
  .msgs{flex:1;overflow-y:auto;padding:18px}
  .msg{max-width:82%;margin:0 0 14px;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
  .msg.in{background:var(--in);align-self:flex-start}
  .msg.out{background:var(--out);align-self:flex-end}
  .msg .meta{font-size:11px;color:var(--faint);margin-bottom:4px}
  .ai{margin:0 18px 14px;padding:12px 14px;border:1px solid var(--gold);border-radius:12px;background:#1a1710}
  .ai h4{margin:0 0 6px;font-size:12px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase}
  .ai .intent{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#2a2415;color:var(--gold);margin-bottom:8px}
  .ai .sum{font-size:13px;color:var(--dim);margin-bottom:8px}
  .ai .acts{font-size:11px;color:var(--faint);margin-top:6px}
  .compose{border-top:1px solid var(--line);padding:12px;background:var(--panel)}
  textarea{width:100%;min-height:80px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:10px;font-size:14px;font-family:inherit;resize:vertical}
  .row{display:flex;gap:8px;margin-top:8px;align-items:center}
  button.primary{background:linear-gradient(180deg,#efd7a0,var(--gold) 60%,#b0894a);color:#241708;border:0;border-radius:999px;padding:8px 20px;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:8px 16px;cursor:pointer}
  .ctx{border-left:1px solid var(--line);padding:16px;background:var(--panel)}
  .ctx h3{font-size:12px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin:0 0 6px}
  .ctx .k{font-size:12px;color:var(--faint)}
  .ctx .v{font-size:14px;margin-bottom:10px}
  .notes .note{font-size:13px;background:var(--panel2);border-radius:8px;padding:8px 10px;margin-bottom:6px;color:var(--dim)}
  .empty{color:var(--faint);padding:30px;text-align:center;font-size:14px}
  .muted{color:var(--faint);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>MACULIS · COMMUNICATIE</h1>
  <div class="tabs">
    <button class="tab on" id="tab-comm" onclick="setBox('communication')">Communicatie</button>
    <button class="tab priv" id="tab-priv" onclick="setBox('privacy')">Privacy Inbox</button>
  </div>
  <div class="sp"></div>
  <a href="/">← Testerbeheer</a>
</header>
<main>
  <div class="col list" id="list"><div class="empty">Laden…</div></div>
  <div class="col thread" id="thread"><div class="empty">Kies een gesprek.</div></div>
  <div class="col ctx" id="ctx"></div>
</main>
<script>
const $=s=>document.querySelector(s);
let box='communication', current=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=(p,o)=>fetch(p,{...o,headers:{'Content-Type':'application/json',...(o&&o.headers)}}).then(r=>r.json());
function setBox(b){ box=b; current=null;
  $('#tab-comm').classList.toggle('on',b==='communication'); $('#tab-priv').classList.toggle('on',b==='privacy');
  $('#thread').innerHTML='<div class="empty">Kies een gesprek.</div>'; $('#ctx').innerHTML=''; loadList(); }
async function loadList(){
  const {conversations}=await api('/api/comm/conversations?box='+box);
  const el=$('#list');
  if(!conversations||!conversations.length){ el.innerHTML='<div class="empty">Nog geen gesprekken.</div>'; return; }
  el.innerHTML=conversations.map(c=>{
    const who=[c.first_name,c.last_name].filter(Boolean).join(' ')||c.email||'Onbekend';
    return `<div class="conv" data-id="${c.id}" onclick="openConv('${c.id}')">
      <span class="badge">${esc(c.status)}</span>
      <div class="who">${esc(who)}</div>
      <div class="org">${esc(c.org||c.email||'')}</div>
      <div class="snip">${esc((c.last_body||'').slice(0,80))}</div></div>`;
  }).join('');
}
async function openConv(id){
  current=id;
  document.querySelectorAll('.conv').forEach(x=>x.classList.toggle('on',x.dataset.id===id));
  const d=await api('/api/comm/conversations/'+id);
  const c=d.conversation;
  const who=[c.first_name,c.last_name].filter(Boolean).join(' ')||c.email||'Onbekend';
  const msgs=(d.messages||[]).map(m=>`<div class="msg ${m.direction==='INBOUND'?'in':'out'}">
     <div class="meta">${m.direction==='INBOUND'?esc(m.from_address||''):'Maculis'} · ${new Date(m.created_at).toLocaleString('nl-NL')}</div>${esc(m.body_text||'')}</div>`).join('');
  const ai=d.ai_draft?`<div class="ai"><h4>AI Copilot-voorstel</h4>
     <span class="intent">${esc(d.ai_draft.intent||'')}</span>
     <div class="sum">${esc(d.ai_draft.summary||'')}</div>
     <div class="muted">Voorgesteld antwoord — controleer en verstuur zelf:</div>
     <div class="acts">Suggesties: ${esc((d.ai_draft.suggested_actions||[]).map(a=>a.type).join(', ')||'—')}</div></div>`:'';
  $('#thread').innerHTML=`<div class="msgs">${msgs||'<div class="empty">Geen berichten.</div>'}${ai}</div>
    <div class="compose"><textarea id="reply" placeholder="Schrijf een antwoord…">${esc(d.ai_draft?d.ai_draft.suggested_reply:'')}</textarea>
      <div class="row"><button class="primary" onclick="send('${id}')">Verzenden</button>
      <button class="ghost" onclick="addNote('${id}')">Interne notitie</button>
      <span class="muted">Niets wordt automatisch verzonden. Jij beslist.</span></div></div>`;
  const notes=(d.notes||[]).map(n=>`<div class="note">${esc(n.body)}</div>`).join('');
  $('#ctx').innerHTML=`<h3>Contact</h3><div class="v">${esc(who)}</div>
    <div class="k">E-mail</div><div class="v">${esc(c.email||'—')}</div>
    <div class="k">Telefoon</div><div class="v">${esc(c.mobile||'—')}</div>
    <h3>Organisatie</h3><div class="v">${esc(c.org||'—')}</div>
    <div class="k">Domein</div><div class="v">${esc(c.primary_domain||'—')}</div>
    <div class="k">Status</div><div class="v">${esc(c.status)}${c.is_privacy?' · PRIVACY':''}</div>
    <h3>Interne notities</h3><div class="notes">${notes||'<div class="muted">Geen notities.</div>'}</div>`;
  $('#thread .msgs').scrollTop=99999;
}
async function send(id){
  const t=$('#reply').value.trim(); if(!t) return;
  const r=await api('/api/comm/conversations/'+id+'/reply',{method:'POST',body:JSON.stringify({text:t})});
  if(r.ok){ openConv(id); loadList(); } else alert('Verzenden mislukt: '+(r.reason||''));
}
async function addNote(id){
  const t=prompt('Interne notitie (nooit extern verzonden):'); if(!t) return;
  await api('/api/comm/conversations/'+id+'/notes',{method:'POST',body:JSON.stringify({body:t})});
  openConv(id);
}
loadList();
</script>
</body>
</html>
