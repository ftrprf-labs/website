<!doctype html>
<html lang="nl" data-maculis-regime="worklight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Maculis · Inbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23080503'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%23c8894a' font-family='Georgia,serif' font-weight='700'%3EM%3C/text%3E%3C/svg%3E">
<!-- Canonieke tokens en letter. Gegenereerd uit ftrlabs-docs 03-ux, nooit met de hand
     bewerken. De checksum wordt bewaakt door tools/check-tokens.mjs. -->
<link rel="stylesheet" href="/vendor/maculis-tokens.css">
<link rel="stylesheet" href="/vendor/newsreader.css">
<style>
  /* Aliaslaag op de canonieke tokens. Geen eigen kleuren meer (canon 13). Identiek aan
     de Workspace, want de rollen zijn hier werkelijk dezelfde: dezelfde grond, dezelfde
     drie tonale niveaus, dezelfde hairlines, dezelfde berichtvlakken. */
  :root{
    --bg:var(--surface-ground);          /* werklicht: ink.950 (canon 5 + C-1) */
    --panel:var(--surface-raised);       /* ink.800 */
    --panel3:var(--surface-elevated);    /* ink.600 */
    --line:var(--border-hairline);
    --line2:var(--border-defined);
    --ink:var(--text-primary);
    --dim:var(--text-secondary);
    --faint:var(--text-quiet);
    --amber:var(--copper-500);
    --gold:var(--gold-500);
    --goldsoft:var(--gold-500);
    --in:var(--surface-raised);
    --out:var(--surface-elevated);
    /* De Privacy-inbox is een CONTEXT, geen status. De canon kent hiervoor geen
       nachtwaarde: surface.private bestaat alleen in het dagregime (canon 6). Deze
       waarde is daarom onveranderd overgenomen en NIET gecanoniseerd. Gemeld, niet
       zelf opgelost. Wel is de undefined-token hiermee weg (F2-a). */
    --priv:#8a3a63;
  }
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font-family:var(--type-sans);background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  a{color:var(--gold);text-decoration:none}
  header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  header .brand{font-family:var(--type-serif);font-optical-sizing:auto;font-size:13px;letter-spacing:.28em;font-weight:500;color:var(--gold)}
  header .tabs{display:flex;gap:4px}
  header .tab{padding:5px 12px;border-radius:var(--radius-pill);background:transparent;border:1px solid var(--line);color:var(--dim);cursor:pointer;font-size:13px}
  header .tab.on{background:transparent;color:var(--ink);border-color:var(--copper-500)}
  header .tab.priv.on{border-color:var(--priv);color:var(--ink)}
  header .sp{flex:1}
  header a.nav{color:var(--dim);font-size:13px;padding:6px 10px;border-radius:8px}
  header a.nav:hover{background:var(--panel);color:var(--ink)}
  .attbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  /* Interactieve pillen zijn echte <button>-elementen: bereikbaar met Tab,
     bedienbaar met Enter. Alleen de knopstijl wordt gereset. */
  .af, .chan, .sug .s{font-family:inherit;line-height:inherit;-webkit-appearance:none;appearance:none}
  .af{font-size:12px;color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:var(--radius-pill);padding:4px 11px;cursor:pointer}
  .af.on{border-color:var(--copper-500);color:var(--copper-500)}
  .af b{color:var(--ink)}
  main{flex:1;display:grid;grid-template-columns:320px 1fr 300px;min-height:0}
  .col{overflow-y:auto;min-height:0}
  .list{border-right:1px solid var(--line)}
  /* De gespreksrij is een echte <button>: bereikbaar met Tab, bedienbaar met Enter.
     Alleen de knopstijl wordt gereset; vorm en gedrag blijven die van een rij. */
  .conv{display:block;width:100%;text-align:left;font:inherit;color:inherit;
    background:transparent;border:0;border-bottom:1px solid var(--line);
    padding:12px 16px;cursor:pointer}
  .conv:hover{background:var(--panel)}.conv.on{background:var(--panel3)}
  .conv .who{font-size:14px;font-weight:400}.conv .org{font-size:12px;color:var(--dim)}
  .conv .snip{font-size:12px;color:var(--faint);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Statuspil (canon 10, amendement C-2): transparant vlak, EEN border.semantic als
     hairline, semantische tekst, radius.pill. Geen gevulde badge. Identiek aan de
     Workspace, want dit zijn dezelfde attentiestaten uit dezelfde attentionOverview. */
  .att{display:inline-block;font-family:var(--type-sans);font-size:var(--type-label);
    letter-spacing:.02em;border-radius:var(--radius-pill);padding:2px 9px;margin-left:6px;
    background:transparent;border:1px solid var(--border-hairline);color:var(--text-secondary)}
  .att.new,.att.waiting_on_us{border-color:var(--border-semantic-signal);color:var(--semantic-signal)}
  .att.ai_ready{border-color:var(--border-semantic-emerging);color:var(--semantic-emerging)}
  .att.unknown_contact,.att.waiting_on_contact{border-color:var(--border-semantic-uncertain);color:var(--semantic-uncertain)}
  .att.delivery_problem{border-color:var(--border-semantic-broken);color:var(--semantic-broken)}
  .thread{display:flex;flex-direction:column;background:var(--bg);min-width:0}
  .msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column}
  .m{max-width:82%;margin-bottom:12px;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
  .m.in{background:var(--in);align-self:flex-start}.m.out{background:var(--out);align-self:flex-end}
  .m .meta{font-size:11px;color:var(--faint);margin-bottom:4px}
  .aipanel{border:1px solid var(--gold);border-radius:12px;background:var(--surface-raised);padding:11px 14px;margin:0 18px 12px}
  .aipanel h4{margin:0 0 5px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
  .aipanel .sum{font-family:var(--type-serif);font-optical-sizing:auto;font-weight:300;letter-spacing:-.017em;font-size:14.5px;line-height:1.4;color:var(--dim)}
  .sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sug .s{font-size:11px;color:var(--gold);border:1px solid var(--line2);border-radius:var(--radius-pill);padding:3px 9px;cursor:pointer;background:transparent}
  .composer{border-top:1px solid var(--line);background:var(--panel);padding:12px 14px}
  .chrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .chan{font-size:12px;border:1px solid var(--line2);color:var(--dim);border-radius:var(--radius-pill);padding:4px 11px;cursor:pointer;background:transparent}
  .chan.on{border-color:var(--copper-500);color:var(--copper-500)}.chan.blocked{opacity:.45;cursor:not-allowed;text-decoration:line-through}
  textarea{width:100%;min-height:84px;background:transparent;border:1px solid var(--line2);border-radius:10px;color:var(--ink);padding:10px;font-size:14px;font-family:inherit;resize:vertical}
  .aichat .log{max-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:8px 0}
  .cm{font-size:13px;padding:7px 11px;border-radius:10px;max-width:88%}
  .cm.user{align-self:flex-end;background:var(--panel3)}.cm.assistant{align-self:flex-start;background:var(--ink-700);border:1px solid var(--line2);color:var(--dim)}
  .aibar{display:flex;gap:8px}.aibar input{flex:1;background:transparent;border:1px solid var(--line2);border-radius:var(--radius-pill);color:var(--ink);padding:9px 14px;font-size:13px}
  .sendrow{display:flex;gap:8px;align-items:center;margin-top:10px}.note{font-size:11px;color:var(--faint)}
  /* Mijn Maculis: de kamers die op één beslissing wachten. Bewust rustig en zonder telling: dit is
     geen teller die vol moet, het is een mens die iets heeft gevraagd. */
  #kamers{display:flex;flex-direction:column;gap:8px;padding:0 14px}
  #kamers:not(:empty){padding-bottom:10px}
  .kamer{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel)}
  .kamer-t{font-size:13px}
  .kamer-i{font-size:12px;color:var(--faint);margin:4px 0 8px}
  .kamer-a{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .uitn-link{flex:1;min-width:240px;font-size:11px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel3);color:var(--ink)}
  .btn{background:transparent;border:1px solid var(--line2);color:var(--ink);border-radius:var(--radius-pill);padding:8px 15px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--amber)}.btn:disabled{opacity:.4}
  .btn.gold{background:linear-gradient(180deg,#efd7a0,var(--gold) 60%,#b0894a);color:#241708;border:0;font-weight:600}
  .ctx{border-left:1px solid var(--line);padding:16px;background:var(--panel)}
  .ctx h3{font-family:var(--type-sans);font-size:var(--type-label);letter-spacing:.16em;color:var(--text-secondary);text-transform:uppercase;margin:0 0 6px;font-weight:600}
  .ctx .k{font-size:12px;color:var(--faint)}.ctx .v{font-size:14px;margin-bottom:10px}
  .empty{font-family:var(--type-serif);font-optical-sizing:auto;font-weight:300;letter-spacing:-.017em;color:var(--dim);padding:28px;text-align:center;font-size:15px;line-height:1.45}
  .aihint{font-size:11px;color:var(--faint);margin:6px 2px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel3);border:1px solid var(--line2);color:var(--ink);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}
  /* Focusring. IMPLEMENTATION CHOICE, geen canon: koper is de enige kleur die
     "kijk hier" zegt (canon 2) en violet is er verboden (canon 13), maar de geometrie
     ligt niet vast. Zelfde terughoudende vorm als in de Workspace. */
  :where(button, a, textarea, input, [tabindex]):focus-visible,
  .conv:focus-visible, .chan:focus-visible, .af:focus-visible, .sug .s:focus-visible{
    outline:2px solid var(--copper-500); outline-offset:2px; border-radius:var(--radius-sm);
  }

  /* Reduced motion. Canon 8.5: toon de eindtoestand, nooit een bevroren begin. */
  @media (prefers-reduced-motion:reduce){
    .toast{transition:none}
  }

  @media(max-width:860px){main{grid-template-columns:1fr}.list{border-right:0;border-bottom:1px solid var(--line);max-height:34vh}.ctx{display:none}}
</style>
</head>
<body>
<header>
  <span class="brand">MACULIS</span>
  <div class="tabs"><button class="tab on" id="tab-comm" data-box="communication">Inbox</button><button class="tab priv" id="tab-priv" data-box="privacy">Privacy</button></div>
  <div class="sp"></div>
  <a class="nav" href="/">Testerbeheer</a>
</header>
<div class="attbar" id="attbar"></div>
<div id="kamers"></div>
<main>
  <div class="col list" id="list"><div class="empty">Laden…</div></div>
  <div class="col thread" id="thread"><div class="empty">Wat vraagt vandaag je aandacht? Kies links een gesprek.</div></div>
  <div class="col ctx" id="ctx"></div>
</main>
<div id="toast" class="toast"></div>
<script src="/comm.js" type="module"></script>
</body>
</html>
