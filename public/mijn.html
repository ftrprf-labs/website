<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mijn Maculis</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/brand/maculis-eye.png" />
  <link rel="stylesheet" href="/mijn.css" />
</head>
<body class="mijn">
  <!-- Access / loading gate: shown until a token resolves. -->
  <div id="gate" class="gate">
    <div class="gate-card">
      <div class="brand-ring" aria-hidden="true"></div>
      <h1 class="brand-word">MAC<span>U</span>LIS</h1>
      <p id="gate-msg" class="gate-msg">Mijn Maculis wordt geopend…</p>
    </div>
  </div>

  <!-- App shell (hidden until authorized). -->
  <div id="app" class="app hidden">
    <!-- Sidebar -->
    <aside class="side">
      <div class="side-brand">
        <div class="brand-ring" aria-hidden="true"></div>
        <div class="brand-text">
          <span class="brand-word small">MAC<span>U</span>LIS</span>
          <span class="brand-sub">Mijn Maculis</span>
        </div>
      </div>

      <nav class="side-nav" aria-label="Hoofdmenu">
        <a class="nav-item" data-route="overzicht" href="#/overzicht">
          <span class="nav-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10.5 12 4l9 6.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-5h5v5"/></svg>
          </span>
          <span class="nav-label"><span class="nav-title">Overzicht</span></span>
        </a>
        <a class="nav-item" data-route="inzichten" href="#/inzichten">
          <span class="nav-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="2.6"/></svg>
          </span>
          <span class="nav-label"><span class="nav-title">Inzichten</span><span class="nav-desc">De Spiegel</span></span>
        </a>
        <a class="nav-item" data-route="samenwerking" href="#/samenwerking">
          <span class="nav-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8.5" cy="9" r="3"/><circle cx="16" cy="10" r="2.4"/><path d="M3.5 19c0-2.8 2.2-4.6 5-4.6s5 1.8 5 4.6"/><path d="M14.5 18.6c.2-2 1.6-3.3 3.6-3.3 1.9 0 3.4 1.3 3.4 3.6"/></svg>
          </span>
          <span class="nav-label"><span class="nav-title">Samenwerking</span></span>
        </a>
      </nav>

      <div class="side-foot">
        <div class="side-org">
          <span class="side-label">Organisatie</span>
          <span id="side-org-name" class="side-org-name">—</span>
        </div>
        <div class="side-user">
          <span id="side-avatar" class="avatar" aria-hidden="true">—</span>
          <span class="side-user-text">
            <span id="side-user-name" class="side-user-name">—</span>
            <span id="side-user-role" class="side-user-role">—</span>
          </span>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-text">
          <h1 id="page-title" class="page-title">Overzicht</h1>
          <p id="page-sub" class="page-sub"></p>
        </div>
        <a class="help" href="#/overzicht" aria-label="Hulp">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.5 2.5 0 0 1 4.6 1.3c0 1.7-2.1 2-2.1 3.4"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/></svg>
          <span>Help</span>
        </a>
      </header>

      <div id="view" class="view" aria-live="polite"></div>

      <footer class="mijn-foot">
        Mijn Maculis is een omgeving van Maculis. Samen bouwen we aan beter zien, begrijpen en kiezen.
      </footer>
    </main>
  </div>

  <!-- Confirmation dialog (share / withdraw). Non-modal fallback friendly; JS wires it up. -->
  <div id="confirm" class="confirm hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="confirm-card">
      <h2 id="confirm-title" class="confirm-title">Delen met Maculis</h2>
      <p id="confirm-body" class="confirm-body"></p>
      <div class="confirm-actions">
        <button id="confirm-cancel" class="btn btn-ghost" type="button">Annuleren</button>
        <button id="confirm-ok" class="btn btn-primary" type="button">Delen met Maculis</button>
      </div>
    </div>
  </div>

  <script src="/mijn.js" defer></script>
</body>
</html>
