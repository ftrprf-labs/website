<!doctype html>
<html lang="nl" data-maculis-regime="worklight">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Maculis Future Cockpit · prototype</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23080503'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23c8894a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23c8894a'/%3E%3C/svg%3E">
  <!-- Canon eerst: de gegenereerde tokens en de canonieke serif. Wijzigen kan
       uitsluitend via hoofdstuk 17 van de Maculis Visual DNA, nooit hier. -->
  <link rel="stylesheet" href="/vendor/maculis-tokens.css">
  <link rel="stylesheet" href="/vendor/newsreader.css">
  <link rel="stylesheet" href="/cockpit.css">
</head>
<body>
  <!-- =====================================================================
       PROTOTYPE. Isolated, additive design exploration for the future
       Maculis "Vandaag" cockpit. All data here is PROTOTYPE DATA (fictional).
       Nothing here touches production Testerbeheer, Inbox, mail or consent.
       CSP-safe: no inline scripts, no inline handlers. Logic in /cockpit.js.
       ===================================================================== -->

  <!-- Prototype controls live OUTSIDE the product. A new colleague never sees a
       second navigation system; there is one nav model (the left rail). This
       launcher and drawer exist only for us to test states, directions and days.
       Nothing here is future product UI. -->
  <button id="proto-toggle" class="proto-toggle" aria-expanded="false" aria-controls="proto-panel">
    <span class="pt-ico" aria-hidden="true">⧉</span> Prototype
  </button>
  <aside id="proto-panel" class="proto-panel" aria-label="Prototype controls" hidden></aside>
  <div id="proto-scrim" class="proto-scrim" hidden></div>

  <div class="shell" data-direction="C" data-space="reveal" id="shell">
    <div class="frame">
      <!-- Calm left rail: few destinations, not a module dump -->
      <aside class="rail" aria-label="Hoofdnavigatie">
        <div class="brand">MACU<span>L</span>IS</div>
        <div class="payoff">Kijk nog eens.</div>
        <nav class="nav" id="nav" aria-label="Hoofdnavigatie">
          <a href="#" data-nav="vandaag" aria-current="page"><span class="ico" aria-hidden="true">◐</span><span class="lbl">Vandaag</span><span class="count" id="nc-vandaag"></span></a>
          <a href="#" data-nav="relaties"><span class="ico" aria-hidden="true">◇</span><span class="lbl">Relaties</span><span class="count" id="nc-relaties"></span></a>
          <a href="#" data-nav="gesprekken"><span class="ico" aria-hidden="true">❯</span><span class="lbl">Gesprekken</span><span class="count" id="nc-gesprekken"></span></a>
          <a href="#" data-nav="groei" id="nav-groei" class="conditional hidden"><span class="ico" aria-hidden="true">✳</span><span class="lbl">Groei</span><span class="count new-dot" aria-label="nieuw"></span></a>
        </nav>
        <div class="foot">
          <a href="#" data-nav="beheer" class="beheer-link"><span class="ico" aria-hidden="true">≡</span><span class="lbl">Beheer</span></a>
          <div class="whoami"><span class="dot"></span> Ludwig · Maculis</div>
          <div style="margin-top:8px">Prototype. Geen productie.</div>
        </div>
      </aside>

      <main class="main">
        <div class="view" id="view" aria-live="polite"></div>
      </main>
    </div>
  </div>

  <script type="module" src="/cockpit.js"></script>
</body>
</html>
