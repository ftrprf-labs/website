<!doctype html>
<html lang="nl" data-maculis-regime="worklight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Maculis · Relatie</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23080503'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%23c8894a' font-family='Georgia,serif' font-weight='700'%3EM%3C/text%3E%3C/svg%3E">
<!-- Canonieke tokens en letter. Gegenereerd uit ftrlabs-docs 03-ux, nooit met de hand
     bewerken. De checksum wordt bewaakt door tools/check-tokens.mjs. -->
<link rel="stylesheet" href="/vendor/maculis-tokens.css">
<link rel="stylesheet" href="/vendor/newsreader.css">
<style>
  /* Aliaslaag op de canonieke tokens. Dit bestand definieert GEEN eigen kleuren meer;
     elke waarde hieronder wijst naar maculis-tokens.css. Canon hoofdstuk 13: nooit een
     eigen :root met eigen kleuren per scherm. */
  :root{
    /* GROND. Werklicht (canon 5 + amendement C-1): ink.950. De regimeverschuiving
       ink.980 -> ink.950 maakt de eerste tonale stap groter, en juist die stap is de
       diepte die werklicht gebruikt in plaats van gloed en schaduw. */
    --bg:var(--surface-ground);

    /* Drie tonale niveaus, niet meer (canon 6). --panel2 is opgeheven:
       vlakken die bij elkaar horen zijn raised, wat nu aandacht vraagt is elevated. */
    --panel:var(--surface-raised);      /* ink.800 */
    --panel3:var(--surface-elevated);   /* ink.600 */

    /* Hairlines: koper. Canon 6 verbiedt neutraal grijs. */
    --line:var(--border-hairline);
    --line2:var(--border-defined);

    /* Tekst. Canon 3.4. Vervangt het koele --dim #9aa0ac en --faint #6b7280 (canon 3.5). */
    --ink:var(--text-primary);
    --dim:var(--text-secondary);
    --faint:var(--text-quiet);

    /* Merk. Koper is het signaal, goud is licht. --goldsoft #e8cf97 is vervallen (canon 3.5). */
    --amber:var(--copper-500);
    --gold:var(--gold-500);
    --goldsoft:var(--gold-500);

    /* Berichtvlakken. Onderscheid via oppervlak, niet via temperatuur
       (canon 12, collaboration surface). De metaregel draagt de richting al. */
    --in:var(--surface-raised);
    --out:var(--surface-elevated);

    /* Nog gebruikt door workspace.js. --ok is een eenduidige canon-match
       (toegestaan = bevestigd). --warn heeft die niet: consent is in canon 10 een eigen
       dimensie, los van de semantische as. Bewust neutraal, want dat beweert niets. */
    --ok:var(--semantic-confirmed);
    --warn:var(--text-secondary);

    --r:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--type-sans);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh;overflow:hidden}
  /* Serif spreekt, sans wijst (canon 4.2). Serif staat uitsluitend waar Maculis iets
     waarneemt, denkt of vraagt. De optische as wordt nooit handmatig overschreven. */
  .say{font-family:var(--type-serif);font-weight:300;letter-spacing:-.017em;font-optical-sizing:auto}
  a{color:var(--gold);text-decoration:none}
  button{font-family:inherit}
  header.top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  header.top .brand{font-family:var(--type-serif);font-optical-sizing:auto;font-size:13px;letter-spacing:.28em;font-weight:500;color:var(--gold)}
  header.top .sp{flex:1}
  header.top a.nav{color:var(--dim);font-size:13px;padding:6px 10px;border-radius:8px}
  header.top a.nav:hover{background:var(--panel);color:var(--ink)}
  .wrap{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0}
  /* Left rail: the relationship identity + navigation */
  .rail{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:20px 18px}
  .org{font-family:var(--type-serif);font-optical-sizing:auto;font-size:22px;font-weight:300;letter-spacing:-.017em;line-height:1.18}
  .stage{display:inline-block;margin-top:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border:1px solid var(--line2);border-radius:999px;padding:3px 10px}
  .person{margin-top:16px}
  .person .name{font-size:16px;font-weight:400}
  .person .role{font-size:13px;color:var(--dim)}
  .ids{margin-top:12px;display:flex;flex-direction:column;gap:6px}
  .id{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--dim)}
  .id .ch{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);width:64px}
  .id .v{color:var(--ink)}
  .next{margin-top:18px;padding:12px 14px;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel)}
  .next .lab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .next .val{font-size:14px;color:var(--goldsoft);margin-top:4px}
  .chips{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:12px;color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:var(--radius-pill);padding:5px 11px}
  .chip b{color:var(--ink)}
  nav.tabs{margin-top:22px;display:flex;flex-direction:column;gap:2px}
  nav.tabs button{text-align:left;background:transparent;border:0;color:var(--dim);font-size:14px;padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  nav.tabs button:hover{background:var(--panel);color:var(--ink)}
  nav.tabs button.on{background:transparent;color:var(--ink);box-shadow:inset 2px 0 0 var(--amber)}
  nav.tabs .badge{font-size:11px;background:var(--amber);color:#1a1206;border-radius:999px;padding:1px 7px;font-weight:600}
  /* Main content */
  .main{overflow:hidden;display:flex;flex-direction:column;min-width:0}
  .view{flex:1;overflow-y:auto;padding:24px 28px;display:none}
  .view.on{display:block}
  h2.sec{font-family:var(--type-sans);font-size:var(--type-label);letter-spacing:.16em;text-transform:uppercase;color:var(--text-secondary);margin:0 0 14px;font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;font-size:14px}
  .kv .k{color:var(--faint)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .qa{display:flex;flex-wrap:wrap;gap:10px}
  .btn{background:transparent;border:1px solid var(--line2);color:var(--ink);border-radius:var(--radius-pill);padding:9px 16px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--amber)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.gold{background:linear-gradient(180deg,#efd7a0,var(--gold) 60%,#b0894a);color:#241708;border:0;font-weight:600}
  .empty{font-family:var(--type-serif);font-optical-sizing:auto;font-weight:300;letter-spacing:-.017em;color:var(--dim);font-size:15px;line-height:1.45;padding:24px 0}
  /* Klikbare rijen zijn echte <button>-elementen: bereikbaar met Tab, bedienbaar met
     Enter. Alleen de knopstijl wordt gereset; vorm en gedrag blijven die van een rij. */
  .list-item{display:block;width:100%;text-align:left;font:inherit;color:inherit;
    background:transparent;border:0;border-bottom:1px solid var(--line);
    padding:12px 0;cursor:pointer}
  .list-item:hover .li-t{color:var(--goldsoft)}
  .li-t{font-size:14px;color:var(--ink)}
  .li-s{font-size:12px;color:var(--faint);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  /* Statuspil (canon 10, amendement C-2): transparant vlak, EEN border.semantic als
     hairline, de semantische kleur als tekst, in radius.pill. Geen gevulde badge, want
     een gevuld vlak maakt kleur tot drager. De tekst draagt altijd de betekenis. */
  .att{display:inline-block;font-family:var(--type-sans);font-size:var(--type-label);
    letter-spacing:.02em;border-radius:var(--radius-pill);padding:2px 9px;margin-left:6px;
    background:transparent;border:1px solid var(--border-hairline);color:var(--text-secondary)}
  .att.new,.att.waiting_on_us{border-color:var(--border-semantic-signal);color:var(--semantic-signal)}
  .att.ai_ready{border-color:var(--border-semantic-emerging);color:var(--semantic-emerging)}
  .att.unknown_contact,.att.waiting_on_contact{border-color:var(--border-semantic-uncertain);color:var(--semantic-uncertain)}
  .att.delivery_problem{border-color:var(--border-semantic-broken);color:var(--semantic-broken)}
  /* Communication: thread + composer */
  .comm{display:grid;grid-template-columns:280px 1fr;gap:0;height:100%}
  .comm .convs{border-right:1px solid var(--line);overflow-y:auto;padding:6px 0}
  .comm .conv{display:block;width:100%;text-align:left;font:inherit;color:inherit;
    background:transparent;border:0;border-bottom:1px solid var(--line);
    padding:11px 16px;cursor:pointer}
  .comm .conv:hover{background:var(--panel)}.comm .conv.on{background:var(--panel3)}
  .comm .conv .t{font-size:13px}.comm .conv .s{font-size:11px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thread{display:flex;flex-direction:column;min-width:0}
  .msgs{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column}
  .m{max-width:80%;margin-bottom:12px;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
  .m.in{background:var(--in);align-self:flex-start}.m.out{background:var(--out);align-self:flex-end}
  .m .meta{font-size:11px;color:var(--faint);margin-bottom:4px}
  .m .del{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
  /* composer */
  .composer{border-top:1px solid var(--line);background:var(--panel);padding:12px 16px}
  .composer .chrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  /* Interactieve pillen zijn echte <button>-elementen: bereikbaar met Tab,
     bedienbaar met Enter. Alleen de knopstijl wordt gereset. */
  .af, .chan, .sug .s{font-family:inherit;line-height:inherit;-webkit-appearance:none;appearance:none}
  .chan{font-size:12px;border:1px solid var(--line2);color:var(--dim);border-radius:var(--radius-pill);padding:5px 12px;cursor:pointer;background:transparent}
  .chan.on{border-color:var(--amber);color:var(--goldsoft)}
  .chan.blocked{opacity:.45;cursor:not-allowed;text-decoration:line-through}
  .composer textarea{width:100%;min-height:96px;background:transparent;border:1px solid var(--line2);border-radius:10px;color:var(--ink);padding:11px;font-size:14px;font-family:inherit;resize:vertical}
  .aihint{font-size:11px;color:var(--faint);margin:6px 2px}
  .aichat{margin-top:8px}
  .aichat .log{max-height:140px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
  .aichat .cm{font-size:13px;padding:7px 11px;border-radius:10px;max-width:88%}
  .aichat .cm.user{align-self:flex-end;background:var(--panel3);color:var(--ink)}
  .aichat .cm.assistant{align-self:flex-start;background:var(--ink-700);border:1px solid var(--line2);color:var(--dim)}
  .aibar{display:flex;gap:8px}
  .aibar input{flex:1;background:transparent;border:1px solid var(--line2);border-radius:999px;color:var(--ink);padding:9px 14px;font-size:13px}
  .sendrow{display:flex;gap:8px;align-items:center;margin-top:10px}
  .sendrow .note{font-size:11px;color:var(--faint)}
  .aipanel{border:1px solid var(--gold);border-radius:12px;background:var(--surface-raised);padding:12px 14px;margin:0 16px 12px}
  .aipanel h4{margin:0 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
  .aipanel .sum{font-family:var(--type-serif);font-optical-sizing:auto;font-weight:300;letter-spacing:-.017em;font-size:14.5px;line-height:1.4;color:var(--dim)}
  .sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .sug .s{font-size:11px;color:var(--goldsoft);border:1px solid var(--line2);border-radius:999px;padding:3px 9px;cursor:pointer}
  .tl{position:relative;padding-left:18px}
  .tl .ev{position:relative;padding:0 0 16px 14px;border-left:1px solid var(--line);}
  .tl .ev:before{content:'';position:absolute;left:-4px;top:3px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
  .tl .ev .d{font-size:11px;color:var(--faint)}
  .tl .ev .b{font-size:14px;margin-top:2px}
  .banner{padding:16px 20px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;margin:24px;color:var(--dim)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel3);border:1px solid var(--line2);color:var(--ink);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  /* Focusring. IMPLEMENTATION CHOICE, geen canon: de canon legt koper vast als de enige
     kleur die "kijk hier" zegt (hoofdstuk 2) en verbiedt violet op een focusring
     (hoofdstuk 13), maar schrijft geen geometrie voor. Gekozen is de meest terughoudende
     vorm die aan beide voldoet: een dunne koperen outline op afstand, geen gloed, geen
     vulling, geen verspringende layout. Bij een canonieke focusspec vervangt die deze regel. */
  :where(button, a, textarea, input, [tabindex]):focus-visible,
  .conv:focus-visible, .chan:focus-visible, .list-item:focus-visible, .sug .s:focus-visible, .af:focus-visible{
    outline:2px solid var(--copper-500);
    outline-offset:2px;
    border-radius:var(--radius-sm);
  }

  /* Reduced motion. Canon 8.5: toon de eindtoestand, nooit een bevroren begin.
     Dit scherm kent een transitie, de toast. Zonder overgang is de eindtoestand
     onmiddellijk zichtbaar, dus de betekenis blijft volledig overeind. */
  @media (prefers-reduced-motion:reduce){
    .toast{transition:none}
  }

  @media(max-width:900px){
    .wrap{grid-template-columns:1fr}
    .rail{border-right:0;border-bottom:1px solid var(--line);max-height:none}
    .comm{grid-template-columns:1fr}
    .comm .convs{max-height:180px;border-right:0;border-bottom:1px solid var(--line)}
    nav.tabs{flex-direction:row;flex-wrap:wrap}
    .grid2{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header class="top">
  <span class="brand">MACULIS</span>
  <a class="nav" href="/">← Testerbeheer</a>
  <a class="nav" href="/comm.html">Inbox</a>
  <div class="sp"></div>
  <span id="mode" class="li-s"></span>
</header>
<div id="root" class="wrap"><div class="banner">Relatie laden…</div></div>
<div id="toast" class="toast"></div>
<script src="/workspace.js" type="module"></script>
</body>
</html>
