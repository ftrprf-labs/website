<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Maculis Cockpit · echte data</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23140e08'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23c8894a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23c8894a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/cockpit.css">
  <style>
    /* Slice 2 — the intelligence layer, made legible. Scoped to the operational cockpit so the
       frozen prototype and its stylesheet stay untouched. Colours are taken from cockpit.css tokens. */
    .intent-chip{display:inline-flex;align-items:center;gap:.4em;font-size:.72rem;font-weight:600;
      letter-spacing:.02em;padding:.18em .6em;border-radius:999px;border:1px solid var(--line,#3a2e20);
      color:var(--ink-2,#b3a48f);text-transform:lowercase}
    .intent-chip.ready{color:var(--ok,#5a9e7a);border-color:color-mix(in srgb,var(--ok,#5a9e7a) 45%,transparent)}
    .intent-chip.now{color:var(--gold,#c8894a);border-color:color-mix(in srgb,var(--gold,#c8894a) 45%,transparent)}
    .item .echo{margin:.25rem 0 .1rem;font-size:.86rem;font-style:italic;opacity:.62}
    .lens{margin:0 0 1.1rem;padding:.95rem 1.1rem;border:1px solid var(--line,#e2d8c6);border-radius:14px;
      background:color-mix(in srgb,var(--gold,#c8894a) 7%,transparent)}
    .lens .lens-h{display:flex;align-items:center;gap:.55rem;font-size:.72rem;letter-spacing:.14em;
      text-transform:uppercase;color:var(--gold,#b0703a);font-weight:600;margin-bottom:.4rem}
    .lens .lens-body{font-size:.98rem;line-height:1.5}
    .lens .lens-intent{margin-top:.55rem}
    .moves{margin-top:1.1rem;display:flex;flex-direction:column;gap:.5rem}
    .moves-h{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2,#6b5e4f);
      font-weight:600;margin-bottom:.15rem}
    .move{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem .8rem;
      border:1px solid var(--line,#e2d8c6);border-radius:12px}
    .move .move-lbl{font-size:.92rem}
    .move .move-prepared{font-size:.74rem;color:var(--ink-2,#6b5e4f);opacity:.8}
    .move .move-done{font-size:.82rem;color:var(--ok,#3f7d5c);font-weight:600}
    /* Slice 3 — real Relaties/Gesprekken overviews reuse the .conv row; this just spaces the list. */
    .ck-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
    .ck-list .conv{cursor:pointer}
    /* Slice 4 — prepared work (follow-ups): complete it from Vandaag or the dossier. */
    .prepared-actions{display:flex;gap:.5rem;margin-top:.7rem}
    .dos-followups{display:flex;flex-direction:column;gap:.55rem}
    .fu-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.55rem .7rem;
      border:1px solid var(--line,#e2d8c6);border-radius:10px}
    .fu-row .fu-main{display:flex;align-items:center;gap:.6rem;min-width:0}
    .fu-row .fu-k{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;
      color:var(--ink-2,#6b5e4f);border:1px solid var(--line,#e2d8c6);border-radius:999px;padding:.1em .5em}
    .fu-row .fu-k.overdue{color:var(--gold,#b0703a);border-color:color-mix(in srgb,var(--gold,#b0703a) 45%,transparent)}
    .fu-row .fu-title{font-size:.92rem}
    /* Slice 5 — Scout as a colleague. Calling a colleague is not an attention item, so the entry
       lives in the rail header and opens a compact modal. Colours from cockpit.css tokens. */
    .ask-scout{display:flex;align-items:center;gap:.5rem;width:100%;margin:.2rem 0 1rem;padding:.5rem .7rem;
      border:1px solid color-mix(in srgb,var(--gold,#c8894a) 40%,transparent);border-radius:10px;cursor:pointer;
      background:color-mix(in srgb,var(--gold,#c8894a) 8%,transparent);color:var(--ink,#f0e6d6);
      font:inherit;font-size:.86rem;font-weight:600;letter-spacing:.01em;text-align:left}
    .ask-scout:hover{border-color:color-mix(in srgb,var(--gold,#c8894a) 65%,transparent);
      background:color-mix(in srgb,var(--gold,#c8894a) 14%,transparent)}
    .ask-scout:focus-visible{outline:2px solid color-mix(in srgb,var(--gold,#c8894a) 65%,transparent);outline-offset:2px}
    .ask-scout .ask-dot{width:.55rem;height:.55rem;border-radius:999px;background:var(--gold,#c8894a);flex:none;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--gold,#c8894a) 20%,transparent)}
    /* Compact modal that opens over the cockpit; the page beneath does not move.
       Colours use the real cockpit.css tokens so the fields sit legibly in the warm dark theme:
       modal = --surface (calm dark plane), input = --field (a distinct, slightly darker plane with a
       warm --border), text = --text, placeholder = --faint, focus = --primary. */
    .scout-modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
      padding:1rem;background:color-mix(in srgb,#000 55%,transparent)}
    .scout-modal-card{width:min(460px,92vw);max-height:90vh;overflow:auto;padding:1.1rem 1.2rem 1.2rem;
      border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
    .scout-modal-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.2rem}
    .scout-modal-head .colleague-dot{width:.6rem;height:.6rem;border-radius:999px;background:var(--primary);flex:none;
      box-shadow:0 0 0 3px var(--primary-soft)}
    .scout-x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:1.3rem;line-height:1;cursor:pointer;padding:.1rem .3rem}
    .scout-x:hover{color:var(--text)}
    .scout-id{display:flex;align-items:baseline;gap:.5rem}
    .scout-id b{font-size:1rem;color:var(--text)}
    .scout-role{font-size:.72rem;letter-spacing:.04em;color:var(--muted)}
    .scout-form{margin-top:.6rem;display:flex;flex-direction:column;gap:.7rem}
    .scout-explain{margin:0;font-size:.86rem;line-height:1.5;color:var(--muted)}
    .scout-f{display:flex;flex-direction:column;gap:.28rem;font-size:.8rem;color:var(--muted)}
    .scout-f em{font-style:normal;color:var(--faint)}
    .scout-f input{padding:.55rem .7rem;border:1px solid var(--border);border-radius:10px;
      background:var(--field);color:var(--text);font-size:.95rem;caret-color:var(--primary)}
    .scout-f input::placeholder{color:var(--faint);opacity:1}
    .scout-f input:hover{border-color:var(--border-strong)}
    .scout-f input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
    .scout-f input:disabled{opacity:.55;cursor:not-allowed}
    /* Keep browser autofill inside the warm dark theme instead of a white box with black text. */
    .scout-f input:-webkit-autofill,
    .scout-f input:-webkit-autofill:hover,
    .scout-f input:-webkit-autofill:focus{
      -webkit-text-fill-color:var(--text);caret-color:var(--text);
      -webkit-box-shadow:0 0 0 1000px var(--field) inset;box-shadow:0 0 0 1000px var(--field) inset;
      border-color:var(--border)}
    /* Clear primary hierarchy: "Laat Scout kijken" leads; Annuleren stays quiet and secondary. */
    .scout-actions{display:flex;align-items:center;gap:.6rem;margin-top:.3rem}
    .scout-actions .btn-primary{flex:1;justify-content:center;font-weight:700;padding-top:.6rem;padding-bottom:.6rem}
    .scout-actions .btn-ghost{flex:none;opacity:.8;font-size:.9rem}
    .scout-status{margin:.1rem 0 0;font-size:.84rem;color:var(--muted);min-height:1em}
    /* Calm post-run confirmation. It never moves the page; "Bekijk" jumps to the item on request. */
    .scout-toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);z-index:55;display:flex;align-items:center;gap:.8rem;
      max-width:min(560px,94vw);padding:.7rem .9rem .7rem 1rem;border:1px solid color-mix(in srgb,var(--ok,#5a9e7a) 45%,transparent);
      border-radius:12px;background:var(--bg-1,#1c140c);box-shadow:0 12px 30px rgba(0,0,0,.4);font-size:.9rem}
    .scout-toast .toast-msg{color:var(--ink,#f0e6d6)}
    .scout-toast .toast-look{border:1px solid color-mix(in srgb,var(--gold,#c8894a) 55%,transparent);border-radius:8px;
      background:color-mix(in srgb,var(--gold,#c8894a) 12%,transparent);color:var(--ink,#f0e6d6);font:inherit;font-weight:600;padding:.3rem .7rem;cursor:pointer}
    .scout-toast .toast-x{margin-left:.1rem;border:0;background:none;color:var(--ink-2,#b3a48f);font-size:1.1rem;line-height:1;cursor:pointer}
    .item.just-landed{outline:2px solid color-mix(in srgb,var(--gold,#c8894a) 65%,transparent);outline-offset:3px;
      transition:outline-color 1.2s ease;border-radius:14px}
    /* Evidence, honestly labelled: real external observations must be distinguishable from Scout's
       own inference and from a demonstration fixture. */
    .work-demo{display:inline-block;margin:.2rem 0 .3rem;padding:.12em .55em;border-radius:999px;font-size:.7rem;
      font-weight:600;color:var(--gold,#b0703a);border:1px dashed color-mix(in srgb,var(--gold,#c8894a) 55%,transparent)}
    .work-ev .ev-item{list-style:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:.45rem;margin:.3rem 0;
      padding:0;font-size:.88rem;line-height:1.45}
    .ev-k{flex:none;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
      padding:.12em .5em;border-radius:999px;border:1px solid var(--line,#3a2e20);color:var(--ink-2,#b3a48f)}
    .ev-k.fact{color:var(--ok,#7bbf9a);border-color:color-mix(in srgb,var(--ok,#5a9e7a) 45%,transparent)}
    .ev-k.obs{color:var(--gold,#d79b5c);border-color:color-mix(in srgb,var(--gold,#c8894a) 55%,transparent)}
    .ev-k.inf{color:var(--ink-2,#b3a48f)}
    .ev-k.hyp{color:var(--ink-2,#b3a48f);border-style:dashed}
    .ev-t{flex:1 1 60%}
    .ev-src{white-space:nowrap;font-size:.8rem;color:var(--gold,#c8894a)}
    a.ev-src{text-decoration:underline}
    .ev-unc{flex-basis:100%;margin-left:.2rem;font-size:.78rem;font-style:italic;opacity:.7}
    .ev-foot{margin-top:.5rem;font-size:.76rem;letter-spacing:.02em;color:var(--ink-2,#6b5e4f);opacity:.85}
    /* Fit vs identity, made legible: "interessant" is not the same as "we weten zeker wie dit is". */
    .work-assess{display:flex;flex-direction:column;gap:.3rem;margin:.5rem 0 .2rem;padding:.55rem .7rem;
      border:1px solid var(--line,#3a2e20);border-radius:10px;background:color-mix(in srgb,#000 10%,transparent)}
    .assess-row{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;font-size:.86rem}
    .assess-k{color:var(--ink-2,#b3a48f)}
    .assess-v{font-weight:600;text-align:right}
    .assess-v.fit-hi{color:var(--ok,#7bbf9a)}
    .assess-v.fit-mid{color:var(--gold,#d79b5c)}
    .assess-v.fit-lo{color:var(--ink-2,#b3a48f)}
    /* Identity as a human two-line statement (main + explanation), covering all three states. */
    .assess-id{display:flex;flex-direction:column;gap:.12rem;margin-top:.1rem}
    .assess-id-main{font-weight:600;font-size:.9rem}
    .assess-id-main.id-ok{color:var(--ok,#7bbf9a)}
    .assess-id-main.id-maybe{color:var(--gold,#d79b5c)}
    .assess-id-main.id-no{color:var(--ink-2,#b3a48f)}
    .assess-id-sub{font-size:.78rem;color:var(--ink-2,#6b5e4f)}
  </style>
</head>
<body>
  <!-- =====================================================================
       OPERATIONAL cockpit, Slice 1. This page renders ONLY real Maculis data
       via /api/cockpit/*. It contains NO fixtures. The frozen design prototype
       lives untouched at /cockpit.html. Same shell + CSS, real stekker.
       ===================================================================== -->
  <div class="shell" data-direction="C" data-space="reveal" id="shell">
    <div class="frame">
      <aside class="rail" aria-label="Hoofdnavigatie">
        <div class="brand">MACU<span>L</span>IS</div>
        <div class="payoff">Kijk nog eens.</div>
        <button type="button" id="ask-scout" class="ask-scout" hidden>
          <span class="ask-dot" aria-hidden="true"></span><span class="lbl">Vraag Scout</span>
        </button>
        <nav class="nav" id="nav" aria-label="Hoofdnavigatie">
          <a href="#" data-nav="vandaag" aria-current="page"><span class="ico" aria-hidden="true">◐</span><span class="lbl">Vandaag</span><span class="count" id="nc-vandaag"></span></a>
          <a href="#" data-nav="relaties"><span class="ico" aria-hidden="true">◇</span><span class="lbl">Relaties</span></a>
          <a href="#" data-nav="gesprekken"><span class="ico" aria-hidden="true">❯</span><span class="lbl">Gesprekken</span></a>
        </nav>
        <div class="foot">
          <a href="#" data-nav="beheer" class="beheer-link"><span class="ico" aria-hidden="true">≡</span><span class="lbl">Beheer</span></a>
          <div class="whoami"><span class="dot"></span> <span id="who">Maculis</span></div>
          <div class="live-badge" style="margin-top:8px;color:var(--ok);font-weight:600">Echte data</div>
        </div>
      </aside>
      <main class="main">
        <div class="view" id="view" aria-live="polite"></div>
      </main>
    </div>
  </div>
  <script type="module" src="/cockpit-live.js"></script>
</body>
</html>
