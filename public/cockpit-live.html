<!doctype html>
<html lang="nl" data-maculis-regime="worklight">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Maculis Cockpit · echte data</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23080503'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23c8894a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23c8894a'/%3E%3C/svg%3E">
  <!-- Canon eerst: de gegenereerde tokens en de canonieke serif. Wijzigen kan
       uitsluitend via hoofdstuk 17 van de Maculis Visual DNA, nooit hier. -->
  <link rel="stylesheet" href="/vendor/maculis-tokens.css">
  <link rel="stylesheet" href="/vendor/newsreader.css">
  <link rel="stylesheet" href="/cockpit.css">
  <style>
    /* Slice 2 — the intelligence layer, made legible. Scoped to the operational cockpit so the
       frozen prototype and its stylesheet stay untouched. Colours are taken from cockpit.css tokens. */
    .intent-chip{display:inline-flex;align-items:center;gap:.4em;font-size:var(--t-label);font-weight:600;
      letter-spacing:.02em;padding:.18em .6em;border-radius:var(--radius-pill);border:1px solid var(--line);
      color:var(--ink-2);text-transform:lowercase}
    .intent-chip.ready{color:var(--ok);border-color:var(--bs-confirmed)}
    .intent-chip.now{color:var(--gold);border-color:var(--bs-signal)}
    .item .echo{margin:var(--s1) 0 var(--s1);font-family:var(--serif);font-style:italic;font-weight:400;font-size:var(--t-body);color:var(--text-quiet)}
    .lens{margin:0 0 1.1rem;padding:.95rem 1.1rem;border:1px solid var(--line);border-radius:var(--radius-md);
      background:transparent}
    .lens .lens-h{display:flex;align-items:center;gap:.55rem;font-size:var(--t-label);letter-spacing:.14em;
      text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:.4rem}
    .lens .lens-body{font-family:var(--serif);font-weight:300;font-optical-sizing:auto;font-size:var(--t-lead);line-height:1.45;letter-spacing:-.017em;color:var(--text)}
    .lens .lens-intent{margin-top:.55rem}
    .moves{margin-top:1.1rem;display:flex;flex-direction:column;gap:.5rem}
    .moves-h{font-size:var(--t-label);letter-spacing:.16em;text-transform:uppercase;color:var(--text-secondary);
      font-weight:600;margin-bottom:var(--s1)}
    .move{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem .8rem;
      border:1px solid var(--line);border-radius:var(--radius-sm)}
    .move .move-lbl{font-size:var(--t-body)}
    .move .move-prepared{font-size:var(--t-fine);color:var(--text-secondary)}
    .move .move-done{font-size:var(--t-fine);color:var(--ok);font-weight:600}
    /* Slice 3 — real Relaties/Gesprekken overviews reuse the .conv row; this just spaces the list. */
    .ck-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
    .ck-list .conv{cursor:pointer}
    /* Slice 4 — prepared work (follow-ups): complete it from Vandaag or the dossier. */
    .prepared-actions{display:flex;gap:.5rem;margin-top:.7rem}
    .dos-followups{display:flex;flex-direction:column;gap:.55rem}
    .fu-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.55rem .7rem;
      border:1px solid var(--line);border-radius:var(--radius-sm)}
    .fu-row .fu-main{display:flex;align-items:center;gap:.6rem;min-width:0}
    .fu-row .fu-k{font-size:var(--t-label);text-transform:uppercase;letter-spacing:.1em;font-weight:700;
      color:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius-pill);padding:.1em .5em}
    .fu-row .fu-k.overdue{color:var(--gold);border-color:var(--bs-signal)}
    .fu-row .fu-title{font-size:var(--t-body)}
    /* Slice 5 — Scout as a colleague. Calling a colleague is not an attention item, so the entry
       lives in the rail header and opens a compact modal. Colours from cockpit.css tokens. */
    .ask-scout{display:flex;align-items:center;gap:.5rem;width:100%;margin:.2rem 0 1rem;padding:.5rem .7rem;
      border:1px solid var(--bs-signal);border-radius:var(--radius-sm);cursor:pointer;
      background:transparent;color:var(--ink);
      font:inherit;font-size:var(--t-body);font-weight:600;letter-spacing:.01em;text-align:left}
    .ask-scout:hover{border-color:var(--primary);
      background:transparent}
    .ask-scout:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
    .ask-scout .ask-dot{width:.55rem;height:.55rem;border-radius:var(--radius-pill);background:var(--gold);flex:none;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 20%,transparent)}
    /* Compact modal that opens over the cockpit; the page beneath does not move.
       Colours use the real cockpit.css tokens so the fields sit legibly in the warm dark theme:
       modal = --surface (calm dark plane), input = --field (a distinct, slightly darker plane with a
       warm --border), text = --text, placeholder = --faint, focus = --primary. */
    .scout-modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
      padding:1rem;background:var(--scrim)}
    .scout-modal-card{width:min(460px,92vw);max-height:90vh;overflow:auto;padding:1.1rem 1.2rem 1.2rem;
      border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);box-shadow:var(--shadow)}
    .scout-modal-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.2rem}
    .scout-modal-head .colleague-dot{width:.6rem;height:.6rem;border-radius:var(--radius-pill);background:var(--primary);flex:none;
      box-shadow:0 0 0 3px var(--primary-soft)}
    .scout-x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:var(--t-lead);line-height:1;cursor:pointer;padding:.1rem .3rem}
    .scout-x:hover{color:var(--text)}
    .scout-id{display:flex;align-items:baseline;gap:.5rem}
    .scout-id b{font-size:var(--t-lead);color:var(--text)}
    .scout-role{font-size:var(--t-label);letter-spacing:.04em;color:var(--muted)}
    .scout-form{margin-top:.6rem;display:flex;flex-direction:column;gap:.7rem}
    .scout-explain{margin:0;font-size:var(--t-body);line-height:1.5;color:var(--muted)}
    .scout-f{display:flex;flex-direction:column;gap:.28rem;font-size:var(--t-fine);color:var(--muted)}
    .scout-f em{font-style:normal;color:var(--faint)}
    .scout-f input{padding:.55rem .7rem;border:1px solid var(--border);border-radius:var(--radius-sm);
      background:var(--field);color:var(--text);font-size:var(--t-body);caret-color:var(--primary)}
    .scout-f input::placeholder{color:var(--faint);opacity:1}
    .scout-f input:hover{border-color:var(--border-strong)}
    .scout-f input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
    .scout-f input:disabled{opacity:.55;cursor:not-allowed}
    /* Keep browser autofill inside the warm dark theme instead of a white box with black text. */
    .scout-f input:-webkit-autofill,
    .scout-f input:-webkit-autofill:hover,
    .scout-f input:-webkit-autofill:focus{
      -webkit-text-fill-color:var(--text);caret-color:var(--text);
      -webkit-box-shadow:0 0 0 1000px var(--field) inset;box-shadow:0 0 0 1000px var(--field) inset;
      border-color:var(--border)}
    /* Clear primary hierarchy: "Laat Scout kijken" leads; Annuleren stays quiet and secondary. */
    .scout-actions{display:flex;align-items:center;gap:.6rem;margin-top:.3rem}
    .scout-actions .btn-primary{flex:1;justify-content:center;font-weight:700;padding-top:.6rem;padding-bottom:.6rem}
    .scout-actions .btn-ghost{flex:none;font-size:var(--t-body)}
    .scout-status{margin:.1rem 0 0;font-size:var(--t-body);color:var(--muted);min-height:1em}
    /* Calm post-run confirmation. It never moves the page; "Bekijk" jumps to the item on request. */
    .scout-toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);z-index:55;display:flex;align-items:center;gap:.8rem;
      max-width:min(560px,94vw);padding:.7rem .9rem .7rem 1rem;border:1px solid var(--bs-confirmed);
      border-radius:var(--radius-sm);background:var(--bg-1);box-shadow:var(--shadow);font-size:var(--t-body)}
    .scout-toast .toast-msg{color:var(--ink)}
    .scout-toast .toast-look{border:1px solid var(--bs-signal);border-radius:var(--radius-sm);
      background:transparent;color:var(--ink);font:inherit;font-weight:600;padding:.3rem .7rem;cursor:pointer}
    .scout-toast .toast-x{margin-left:.1rem;border:0;background:none;color:var(--ink-2);font-size:var(--t-lead);line-height:1;cursor:pointer}
    /* Evidence, honestly labelled: real external observations must be distinguishable from Scout's
       own inference and from a demonstration fixture. */
    .work-demo{display:inline-block;margin:.2rem 0 .3rem;padding:.12em .55em;border-radius:var(--radius-pill);font-size:var(--t-label);
      font-weight:600;color:var(--uncertain);border:1px dashed var(--bs-uncertain)}
    .work-ev .ev-item{list-style:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:.45rem;margin:.3rem 0;
      padding:0;font-size:var(--t-body);line-height:1.45}
    .ev-k{flex:none;font-size:var(--t-label);letter-spacing:.16em;text-transform:uppercase;font-weight:700;
      padding:.12em .6em;border-radius:var(--radius-pill);border:1px solid var(--bs-uncertain);color:var(--text-secondary)}
    .ev-k.fact{color:var(--ok);border-color:var(--bs-confirmed)}
    .ev-k.obs{color:var(--primary);border-color:var(--bs-signal)}
    .ev-k.inf{color:var(--uncertain);border-color:var(--bs-uncertain)}
    .ev-k.hyp{color:var(--uncertain);border-color:var(--bs-uncertain);border-style:dashed}
    .ev-t{flex:1 1 60%}
    .ev-src{white-space:nowrap;font-size:var(--t-fine);color:var(--gold)}
    a.ev-src{text-decoration:underline}
    .ev-unc{flex-basis:100%;margin-left:.2rem;font-size:var(--t-fine);font-family:var(--serif);font-style:italic;font-weight:400;color:var(--text-secondary)}
    .ev-foot{margin-top:var(--s2);font-size:var(--t-fine);letter-spacing:.02em;color:var(--text-secondary)}
    /* Fit vs identity, made legible: "interessant" is not the same as "we weten zeker wie dit is". */
    .work-assess{display:flex;flex-direction:column;gap:.3rem;margin:.5rem 0 .2rem;padding:.55rem .7rem;
      border:1px solid var(--line);border-radius:var(--radius-sm);background:transparent}
    .assess-row{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;font-size:var(--t-body)}
    .assess-k{color:var(--ink-2)}
    .assess-v{font-weight:600;text-align:right}
    .assess-v.fit-hi{color:var(--ok)}
    .assess-v.fit-mid{color:var(--primary)}
    .assess-v.fit-lo{color:var(--uncertain)}
    /* Identity as a human two-line statement (main + explanation), covering all three states. */
    .assess-id{display:flex;flex-direction:column;gap:.12rem;margin-top:.1rem}
    .assess-id-main{font-weight:600;font-size:var(--t-body)}
    .assess-id-main.id-ok{color:var(--ok)}
    .assess-id-main.id-maybe{color:var(--emerging)}
    .assess-id-main.id-no{color:var(--uncertain)}
    .assess-id-sub{font-size:var(--t-fine);color:var(--text-secondary)}
  </style>
</head>
<body>
  <!-- =====================================================================
       OPERATIONAL cockpit, Slice 1. This page renders ONLY real Maculis data
       via /api/cockpit/*. It contains NO fixtures. The frozen design prototype
       lives untouched at /cockpit.html. Same shell + CSS, real stekker.
       ===================================================================== -->
  <div class="shell" data-direction="C" data-space="reveal" id="shell">
    <div class="frame">
      <aside class="rail" aria-label="Hoofdnavigatie">
        <div class="brand">MACU<span>L</span>IS</div>
        <div class="payoff">Kijk nog eens.</div>
        <button type="button" id="ask-scout" class="ask-scout" hidden>
          <span class="ask-dot" aria-hidden="true"></span><span class="lbl">Vraag Scout</span>
        </button>
        <nav class="nav" id="nav" aria-label="Hoofdnavigatie">
          <a href="#" data-nav="vandaag" aria-current="page"><span class="ico" aria-hidden="true">◐</span><span class="lbl">Vandaag</span><span class="count" id="nc-vandaag"></span></a>
          <a href="#" data-nav="relaties"><span class="ico" aria-hidden="true">◇</span><span class="lbl">Relaties</span></a>
          <a href="#" data-nav="gesprekken"><span class="ico" aria-hidden="true">❯</span><span class="lbl">Gesprekken</span></a>
        </nav>
        <div class="foot">
          <a href="#" data-nav="beheer" class="beheer-link"><span class="ico" aria-hidden="true">≡</span><span class="lbl">Beheer</span></a>
          <div class="whoami"><span class="dot"></span> <span id="who">Maculis</span></div>
          <!-- De badge stond hier hard op "Echte data", ook wanneer de pagina meldde dat er geen
               database is. Dat is een vertrouwensfout: het scherm beweerde echte data te tonen
               terwijl het net had gezegd niets te hebben. cockpit-live.js zet hem nu naar de
               werkelijke toestand. -->
          <div class="live-badge" id="live-badge" hidden></div>
        </div>
      </aside>
      <main class="main">
        <div class="view" id="view" aria-live="polite"></div>
      </main>
    </div>
  </div>
  <script type="module" src="/cockpit-live.js"></script>
</body>
</html>
