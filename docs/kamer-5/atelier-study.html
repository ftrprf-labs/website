/* Eén vastgelegde wereld: de Maculis-inktnacht. Bewust geen licht thema.
   Alle kleuren expliciet gezet zodat de pagina op elke ondergrond standhoudt. */
:root{
  --inkt:#080503;
  --inkt-op:#100a06;
  --inkt-hoog:#171009;
  --perkament:#ece2d4;
  --perkament-stil:#93887a;
  --perkament-zwak:#5f574c;
  --koper:#c8894a;
  --koper-licht:#e8b478;
  --violet:#9179c0;
  --violet-diep:#61508c;
  --lijn:rgba(200,137,74,.15);
  --lijn-zacht:rgba(200,137,74,.08);
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --rij:66px;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--inkt);color:var(--perkament);
  font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.atelier{
  position:relative;height:100dvh;min-height:520px;display:flex;flex-direction:column;
  padding:clamp(18px,3.4vw,46px) clamp(18px,4vw,60px) 0;
  background:
    radial-gradient(120% 80% at 50% 0%,rgba(200,137,74,.045),transparent 62%),
    radial-gradient(90% 70% at 50% 100%,rgba(145,121,192,.035),transparent 60%),
    var(--inkt);
  overflow:hidden;
}

/* ---- kop ---- */
.kop{display:flex;align-items:baseline;gap:14px;flex-shrink:0}
.merk{font-family:var(--serif);font-weight:500;letter-spacing:.26em;font-size:12px;color:var(--perkament-stil)}
.merk b{color:var(--koper);font-weight:500}
.kop .rek{flex:1}
.klok{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--perkament-zwak);font-variant-numeric:tabular-nums}

/* ---- de zin ---- */
.stand{flex-shrink:0;margin:clamp(24px,5vh,58px) 0 clamp(20px,4vh,40px)}
.zin{
  font-family:var(--serif);font-weight:300;
  font-size:clamp(27px,3.6vw,45px);line-height:1.16;letter-spacing:-.005em;
  color:var(--perkament);margin:0;text-wrap:balance;max-width:12em;
  transition:opacity .7s ease;
}
.zin.wisselt{opacity:0}
.telling{margin:14px 0 0;max-width:52ch;font-size:12.5px;color:var(--perkament-zwak);letter-spacing:.02em}
.telling b{color:var(--perkament-stil);font-weight:400}

/* ---- het veld ---- */
.veld{flex:1;position:relative;min-height:0;transition:opacity .5s ease;
  overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;
  scrollbar-color:rgba(200,137,74,.22) transparent;}
.veld::-webkit-scrollbar{width:6px}
.veld::-webkit-scrollbar-thumb{background:rgba(200,137,74,.22);border-radius:3px}
.veld.gedimd{opacity:.4}
.rijen{position:relative;height:100%}
.rij{
  position:absolute;left:0;right:0;top:0;height:var(--rij);
  display:grid;grid-template-columns:minmax(0,31ch) 1fr;gap:clamp(16px,2.6vw,34px);
  align-items:center;padding:0 2px;
  border:0;background:none;color:inherit;text-align:left;font:inherit;
  cursor:pointer;border-radius:3px;
  transition:transform .85s cubic-bezier(.22,.61,.36,1),opacity .6s ease;
}
.rij::after{
  content:"";position:absolute;left:-14px;right:-14px;top:4px;bottom:4px;
  border-radius:4px;background:rgba(236,226,212,.028);opacity:0;
  transition:opacity .25s ease;pointer-events:none;
}
.rij:hover::after{opacity:1}
.rij:focus-visible{outline:1px solid var(--koper);outline-offset:6px}
.rij.open::after{opacity:1}

.vraag{
  font-family:var(--serif);font-weight:300;font-size:15.5px;line-height:1.32;
  color:var(--perkament-stil);margin:0;
  transition:color .8s ease,opacity .8s ease;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.rij.vast .vraag{color:var(--perkament)}
.rij.wording .vraag{color:#a898c4}

/* ---- het spoor ---- */
.spoor{position:relative;height:100%;display:flex;align-items:center}
.draad{
  position:absolute;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--lijn-zacht) 12%,var(--lijn) 88%,transparent);
}
.litteken{
  position:absolute;height:15px;border-radius:8px;
  background:radial-gradient(ellipse at center,rgba(200,137,74,.14),transparent 72%);
  opacity:0;transition:opacity 1.1s ease;pointer-events:none;
}
.litteken.aan{opacity:1}

.merkje{
  position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;
  transition:left .9s cubic-bezier(.22,.61,.36,1),opacity .9s ease,
             transform .9s cubic-bezier(.22,.61,.36,1),box-shadow .9s ease,background .9s ease;
}
.merkje.komt{animation:komt 1.5s cubic-bezier(.22,.61,.36,1) both}
@keyframes komt{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}

/* koper = grond. violet = betekenis in wording. licht = verdichting. */
.merkje.koper{background:var(--koper);box-shadow:0 0 9px 1px rgba(200,137,74,.32)}
.merkje.koper.hel{background:var(--koper-licht);box-shadow:0 0 15px 3px rgba(232,180,120,.42)}
.merkje.violet{background:var(--violet-diep);box-shadow:0 0 9px 1px rgba(145,121,192,.3)}
.merkje.violet.hel{background:var(--violet);box-shadow:0 0 15px 3px rgba(145,121,192,.4)}
.merkje.zwak{opacity:.42;width:6px;height:6px;margin:-3px 0 0 -3px}

/* een besluit is een moment, geen punt: een korte verticale streek */
.merkje.besluit{
  width:2px;height:19px;border-radius:1px;margin:-9.5px 0 0 -1px;
  background:var(--koper-licht);box-shadow:0 0 12px 2px rgba(200,137,74,.3);
}
/* canon draagt een stille ring */
.merkje.canon::after{
  content:"";position:absolute;left:50%;top:50%;width:21px;height:21px;
  margin:-10.5px 0 0 -10.5px;border-radius:50%;
  border:1px solid rgba(200,137,74,.26);
}
.merkje.beweegt{animation:adem 5.5s ease-in-out infinite}
@keyframes adem{
  0%,100%{transform:translateY(0) scale(1);opacity:.72}
  50%{transform:translateY(-3.5px) scale(1.1);opacity:1}
}
.merkje.wacht{animation:wacht 3.4s ease-in-out infinite}
@keyframes wacht{
  0%,100%{box-shadow:0 0 10px 1px rgba(232,180,120,.3)}
  50%{box-shadow:0 0 22px 5px rgba(232,180,120,.55)}
}

  var s=lijnen();

function pasOordeelToe(s){

/* Aandacht wordt afgeleid, nooit opgeslagen. Drie regels, in deze volgorde. */
function afgeleideZin(s){
  var wacht=0,druk=0,grondloos=0;
  s.forEach(function(l){
    if(l.wacht) wacht++;
    if(l.onderdruk) druk++;
    if(l.bouwt&&l.grond<2) grondloos++;
  });
  if(wacht===1) return "Eén ding wacht op jouw oordeel.";
  if(wacht>1) return wacht+" dingen wachten op jouw oordeel.";
  if(druk>0) return druk===1?"Eén besluit staat onder druk.":druk+" besluiten staan onder druk.";
  if(grondloos>0) return "Er wordt gebouwd aan iets waarvoor geen besluit bestaat.";
  return "Er wacht niets op jou.";
}

function telZin(s){
  var vast=0,beweegt=0;
  s.forEach(function(l){ if(l.grond>=3) vast++; if(l.beweegt||l.bouwt) beweegt++; });
  var d=["<b>"+s.length+"</b> lijnen"];
  d.push("<b>"+vast+"</b> "+(vast===1?"staat":"staan")+" vast");
  if(beweegt) d.push("<b>"+beweegt+"</b> in beweging");
  return d.join(". ")+".";
}

function gesorteerd(s){
  return s.slice().sort(function(a,b){
    if(a.grond!==b.grond) return a.grond-b.grond;
    return a.id<b.id?-1:1;
  });
}

  tellingEl.innerHTML=telZin(s);

      rij.type="button"; rij.className="rij";

      rij.addEventListener("click",function(){ toon(l.id); });
      rijenEl.appendChild(rij);
      rijEls[l.id]=rij; merkEls[l.id]={};
    }
    rij.className="rij"+(l.grond>=3?" vast":"")+(l.grond<=1&&(l.beweegt||l.open.length>l.weten.length)?" wording":"")+(openLijn===l.id?" open":"");

    l.merken.forEach(function(m,j){
      var sleutel=l.id+"-"+j, el=merkEls[l.id][sleutel];
      gezien[sleutel]=1;
      if(!el){
        el=document.createElement("span");
        el.className="merkje";
        spoor.appendChild(el);
        if(!eersteTeken) el.classList.add("komt");

      var kl="merkje";
      if(soort==="besluit") kl+=" besluit";
      else if(soort==="canon") kl+=" koper canon hel";
      else if(soort==="koper") kl+=" koper"+(kracht>=3?" hel":"")+(kracht<=1?" zwak":"");
      else kl+=" violet"+(kracht>=1?" hel":"")+(kracht<1?" zwak":"");
      var laatste=(j===l.merken.length-1);
      if(l.beweegt&&laatste&&soort!=="besluit"&&soort!=="canon") kl+=" beweegt";
      if(l.bouwt&&laatste) kl+=" beweegt";
      if(l.wacht&&laatste) kl+=" wacht";
      if(el.className.indexOf("komt")>-1) kl+=" komt";
      el.className=kl;
      el.style.left=(m[0]*100)+"%";
    });
    Object.keys(merkEls[l.id]).forEach(function(k){
      if(!gezien[k]){ merkEls[l.id][k].remove(); delete merkEls[l.id][k]; }
    });
  });
  eersteTeken=false;
  pasRijen();
  if(openLijn) vulPaneel(vind(s,openLijn));
}

/* De rijhoogte past zich aan de ruimte aan zodat het hele veld in beeld blijft.
   Onder de ondergrens gaat het veld zelf schuiven. Draait opnieuw zodra de zin
   van hoogte verandert. */
function pasRijen(){
  if(!staat) return;
  var orde=gesorteerd(staat);
  var smal=window.innerWidth<=860;
  var maxH=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--rij"))||66;
  var minH=smal?82:48;
  var ruimte=veld.clientHeight||0;
  var rijH=Math.max(minH,Math.min(maxH,Math.floor(ruimte/orde.length)));
  rijenEl.style.height=(orde.length*rijH)+"px";
  orde.forEach(function(l,i){
    var rij=rijEls[l.id];
    if(!rij) return;
    rij.style.transform="translateY("+(i*rijH)+"px)";
    rij.style.height=rijH+"px";
  });
}

function toon(id){
  openLijn=id;
  vulPaneel(vind(staat,id));
  paneel.classList.add("open");
  paneel.setAttribute("aria-hidden","false");
  veld.classList.add("gedimd");
  teken();
}
function sluitPaneel(){
  openLijn=null;
  paneel.classList.remove("open");
  paneel.setAttribute("aria-hidden","true");
  veld.classList.remove("gedimd");
  teken();
}

function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function vulPaneel(l){
  if(!l) return;
  var h="";
  h+='<p class="p-grond">Grond: <span class="'+(l.grond<=1?"wording":"")+'">'+GROND[l.grond]+"</span>"
    +(l.beweegt||l.bouwt?" · in beweging":" · stil")+"</p>";
  h+='<h2 class="p-vraag">'+esc(l.vraag)+"</h2>";

  h+='<p class="kopje">Wat we weten</p>';
  h+=l.weten.length
    ? '<ul class="p-lijst">'+l.weten.map(function(t){return "<li>"+esc(t)+"</li>";}).join("")+"</ul>"
    : '<p class="p-leeg">Nog niets waarop we kunnen staan.</p>';

  h+='<p class="kopje">Wat we nog niet weten</p>';
  h+=l.open.length
    ? '<ul class="p-lijst open">'+l.open.map(function(t){return "<li>"+esc(t)+"</li>";}).join("")+"</ul>"
    : '<p class="p-leeg">Niets meer open.</p>';

  h+='<p class="kopje">Laatste besluit</p>';
  h+=l.besluit
    ? '<p class="p-besluit">'+esc(l.besluit.tekst)+'<span class="p-datum">'+esc(l.besluit.datum)
      +(l.onderdruk?" · staat onder druk":"")+"</span></p>"
    : '<p class="p-leeg">Er is hier nog niets besloten.</p>';

  if(l.wacht&&l.bewijs){
    h+='<div class="oordeel"><p class="waarop">Bewijs, tegenover deze vraag</p>'
      +'<p class="bewijs">'+esc(l.bewijs)+"</p>"
      +'<div class="knoppen">'
      +'<button class="knop ja" type="button" data-oordeel="ja">Dit klopt</button>'
      +'<button class="knop" type="button" data-oordeel="nee">Dit klopt niet</button>'
      +'<button class="knop" type="button" data-oordeel="misschien">Nog niet genoeg</button>'
      +"</div></div>";
  }
  paneelInhoud.innerHTML=h;
  Array.prototype.forEach.call(paneelInhoud.querySelectorAll("[data-oordeel]"),function(b){
    b.addEventListener("click",function(){
      oordeel=b.getAttribute("data-oordeel");
      if(stap<7) stap=7;
      herbouw();
    });
  });
}

function herbouw(){
  staat=bouwStaat(stap);
  var m=MOMENTEN[stap];
  klokEl.textContent=m.klok;
  if(vertelEl.textContent!==m.vertelling){
    vertelEl.classList.add("wisselt");
    setTimeout(function(){ vertelEl.textContent=m.vertelling; vertelEl.classList.remove("wisselt"); },240);
  }
  Array.prototype.forEach.call(tikkenEl.children,function(t,i){
    t.className="tik"+(i===stap?" nu":(i<stap?" gehad":""));
    t.setAttribute("aria-current",i===stap?"true":"false");
  });
  terugBtn.disabled=(stap===0);
  verderBtn.disabled=(stap===MOMENTEN.length-1);
  if(m.opent){ openLijn=m.opent; paneel.classList.add("open");
    paneel.setAttribute("aria-hidden","false"); veld.classList.add("gedimd"); }
  teken();
}

function ga(n){
  var nieuw=Math.max(0,Math.min(MOMENTEN.length-1,n));
  if(nieuw===stap) return;
  if(nieuw<7) oordeel=null;
  /* Wie doorloopt zonder te oordelen, krijgt het getoonde pad. Terugstappen wist het weer. */
  if(nieuw>6&&!oordeel) oordeel="ja";
  stap=nieuw;
  if(!MOMENTEN[stap].opent&&openLijn&&stap!==6) sluitPaneel();
  herbouw();
}

MOMENTEN.forEach(function(m,i){
  var t=document.createElement("button");
  t.type="button"; t.className="tik";
  t.setAttribute("aria-label","Moment "+(i+1)+": "+m.naam);
  t.addEventListener("click",function(){ ga(i); });
  tikkenEl.appendChild(t);
});
verderBtn.addEventListener("click",function(){ ga(stap+1); });
terugBtn.addEventListener("click",function(){ ga(stap-1); });
sluitBtn.addEventListener("click",sluitPaneel);
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"){ ga(stap+1); }
  else if(e.key==="ArrowLeft"){ ga(stap-1); }
  else if(e.key==="Escape"&&openLijn){ sluitPaneel(); }
});
window.addEventListener("resize",pasRijen);
if(window.ResizeObserver) new ResizeObserver(pasRijen).observe(veld);
herbouw();
})();
</script>
